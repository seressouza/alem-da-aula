<style>
:root{
  --navy:#0A1A4A; --navy2:#13286B; --cream:#F6F3EC; --paper:#FFFDF8; --ink:#14213D;
  --muted:#5C6870; --line:#E2DCCD; --rust:#C2410C; --coral:#E4572E; --cyan:#24B5EB; --blue:#0B5FA5;
  --ok:#1F6B35; --okbg:#E3F1E6; --bad:#B03A0A; --badbg:#FDECE2; --warnbg:#FFF6E0;
  --r:16px;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--blue)}
button{font:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{background:var(--navy);color:var(--cream);padding:calc(14px + env(safe-area-inset-top)) 0 14px;position:sticky;top:0;z-index:10}
header.top .wrap{display:flex;align-items:center;gap:12px}
header.top .back{background:none;border:0;color:var(--cream);font-size:22px;padding:4px 8px 4px 0;cursor:pointer;line-height:1}
header.top .title{font-weight:700;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .prog{font-size:13px;color:#C5D2D9;white-space:nowrap}
.hero{background:var(--navy);color:var(--cream);padding:8px 0 28px}
.hero h1{font-size:30px;line-height:1.12;margin:6px 0 10px;letter-spacing:-.01em}
.hero p{color:#C5D2D9;margin:0 0 14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#FF8A65}
.ecg{display:block;width:100%;height:46px;margin:8px 0 4px}
.ecg path{stroke:var(--cyan);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.ecg path{animation:none;stroke-dashoffset:0}}
.bar{height:8px;background:rgba(255,255,255,.18);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--coral);border-radius:8px;transition:width .4s}
.barlabel{font-size:13px;color:#C5D2D9;margin-top:6px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 14px;border-radius:12px;border:0;background:var(--coral);color:#fff;font-weight:700;text-decoration:none;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--cream);border:1.5px solid rgba(246,243,236,.5)}
.btn.light{background:var(--paper);color:var(--navy);border:1.5px solid var(--line)}
.btn.small{min-height:40px;font-size:14px;padding:8px 12px}
main{padding:18px 0 calc(40px + env(safe-area-inset-bottom))}
h2{font-size:22px;line-height:1.2;margin:22px 0 10px;color:var(--navy)}
h3{font-size:18px;line-height:1.25;margin:0 0 8px;color:var(--navy)}
.trail{list-style:none;margin:0;padding:0;position:relative}
.trail:before{content:"";position:absolute;left:23px;top:24px;bottom:24px;width:3px;background:var(--line);border-radius:3px}
.station{position:relative;display:flex;gap:14px;align-items:stretch;margin:0 0 12px;text-decoration:none;color:inherit}
.dot{flex:0 0 48px;height:48px;border-radius:50%;background:var(--paper);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);z-index:1;font-size:17px}
.station.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.station.started .dot{border-color:var(--coral)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;flex:1}
.station .card h3{margin:0 0 2px;font-size:17px}
.station .card p{margin:0;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;font-weight:600;background:#EAF2FA;color:var(--blue);border-radius:20px;padding:2px 9px}
.chip.q{background:var(--badbg);color:var(--rust)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.block{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.block p{margin:0 0 10px}.block p:last-child{margin-bottom:0}
.block ul{margin:0 0 10px;padding-left:20px}.block li{margin-bottom:5px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--rust);margin-bottom:6px;display:block}
.kicker.blue{color:var(--blue)}
.note{background:var(--warnbg);border:1px solid #EBC774;border-radius:12px;padding:12px 14px;font-size:14px;margin:0 0 14px}
.quote{font-style:italic;font-size:18px;color:var(--navy);border-left:4px solid var(--coral);padding:4px 0 4px 14px;margin:6px 0 14px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:4px 0 6px}
th{background:var(--navy);color:var(--cream);text-align:left;padding:8px;font-weight:600}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto;margin:0 -4px}
label{display:block;font-size:14px;font-weight:600;color:var(--navy);margin:10px 0 4px}
input[type=number],select{width:100%;min-height:46px;font-size:17px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:3px solid rgba(36,181,235,.35);border-color:var(--cyan)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.out{margin-top:12px;background:var(--navy);color:var(--cream);border-radius:12px;padding:14px}
.out .big{font-size:28px;font-weight:800;line-height:1.1;color:#fff}
.out .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#9FB1BC}
.out p{margin:6px 0 0;color:#C5D2D9;font-size:14px}
.outgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.seg button{flex:1 1 auto;min-height:44px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink);text-align:left}
.seg button[aria-pressed=true]{border-color:var(--navy);background:var(--navy);color:#fff}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{min-height:48px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{border-radius:12px;padding:12px 14px;font-size:15px;margin-top:4px}
.fb.ok{background:var(--okbg);color:#173F22}
.fb.bad{background:var(--badbg);color:#5A1E05}
.qhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.qtext{font-weight:700;font-size:17px;color:var(--navy)}
.sortitem{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;background:#fff}
.sortitem .seg button{flex:1 1 30%;text-align:center;font-size:13px;min-height:40px;padding:6px}
.sortitem.right{border-color:var(--ok);background:var(--okbg)}
.sortitem.wrong{border-color:var(--bad);background:var(--badbg)}
.links a{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.links a:last-child{border-bottom:0}
.links a span.s{font-size:13px;color:var(--muted)}
.links a b{color:var(--navy);font-weight:600}
.net{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.navbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.badge{text-align:center;padding:22px 16px}
.badge .medal{font-size:54px;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:24px;font-size:14px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.small{font-size:13px;color:var(--muted)}
footer{font-size:12px;color:var(--muted);padding:10px 0 30px;text-align:center}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:0 0 12px 40px}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
@media (max-width:380px){.hero h1{font-size:26px}.actions{grid-template-columns:1fr}.outgrid{grid-template-columns:1fr}}
</style>

<script>
"use strict";
/* ====================== Armazenamento seguro ====================== */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let progress = store.get("trilha-cc-v1", {});   // { moduleId: {quiz:{score,total}, visited:true} }
function saveProgress(){ store.set("trilha-cc-v1", progress); }

/* ====================== Conteúdo ====================== */
const PUB = t => "https://pubmed.ncbi.nlm.nih.gov/?term=" + encodeURIComponent(t);

const MODULES = [
{
  id:"caso", n:1, title:"O caso e o ERAS", sub:"Seu Raimundo, a angina e o fio condutor",
  blocks:[
    {t:"html", html:`<span class="kicker">O paciente (caso fictício)</span>
      <p><b>Seu Raimundo, 62 anos.</b> DAC triarterial, angina <b>CCS II</b>, FEVE 48%. Diabetes tipo 2 (HbA1c 8,4%), hipertensão, dislipidemia. Sedentário, IMC 29, mora num sobrado com dois lances de escada. Revascularização eletiva em três semanas.</p>
      <div class="quote">“Doutora, eu só quero voltar a caminhar na orla com meus netos sem essa dor no peito.”</div>
      <p class="small">Os números do caso são ilustrativos e coerentes entre si. Ajuste ao protocolo do seu serviço.</p>`},
    {t:"html", html:`<span class="kicker">Classificação CCS da angina</span>
      <p>A classificação da Canadian Cardiovascular Society gradua <b>o esforço que provoca a angina</b>. É o equivalente da NYHA, mas a NYHA mede dispneia e cansaço na insuficiência cardíaca.</p>
      <div class="tablewrap"><table>
      <tr><th>Classe</th><th>Quando aparece a dor</th></tr>
      <tr><td><b>I</b></td><td>Só em esforço intenso, rápido ou prolongado.</td></tr>
      <tr><td><b>II</b></td><td>Subir escada ou andar rápido, ladeira, após refeição, frio, estresse; ou andar mais de 2 quarteirões no plano, ou subir mais de 1 lance em ritmo normal.</td></tr>
      <tr><td><b>III</b></td><td>Andar 1 a 2 quarteirões no plano ou subir 1 lance em ritmo normal.</td></tr>
      <tr><td><b>IV</b></td><td>Qualquer atividade; pode ocorrer em repouso.</td></tr>
      </table></div>`},
    {t:"calc", id:"ccs"},
    {t:"html", html:`<span class="kicker">ERAS Cardiac 2024</span>
      <p>Consenso conjunto da ERAS Cardiac Society, ERAS Society e Society of Thoracic Surgeons. Entre os poucos elementos com <b>evidência de alta qualidade</b>, dois passam pela mão do fisioterapeuta: <b>ventilação mecânica protetora</b> e <b>triagem e prevenção de delirium</b>.</p>
      <p>A pré-habilitação aparece com evidência baixa. Isso não quer dizer que não funciona: quer dizer que os estudos são heterogêneos. Para o treino muscular inspiratório, os dados são consistentes.</p>`},
  ],
  quiz:[
    {q:"Seu Raimundo sente angina ao subir dois lances de escada em ritmo normal, mas não ao subir um. Qual a classe CCS?", o:["CCS I","CCS II","CCS III","CCS IV"], a:1, e:"Angina ao subir mais de um lance em ritmo normal é classe II. Na III, a dor já aparece com um lance."},
    {q:"Quais elementos do ERAS Cardiac 2024 com evidência alta passam diretamente pela fisioterapia?", o:["Pré-habilitação e TMI","Ventilação protetora e prevenção de delirium","Extubação em 6 h e deambulação precoce","Analgesia multimodal e prevenção de FA"], a:1, e:"Ventilação protetora e triagem/prevenção de delirium têm evidência alta. Extubação precoce e deambulação têm evidência moderada."},
    {q:"No ERAS 2024, “evidência baixa” para pré-habilitação multicomponente significa que:", o:["A pré-habilitação não funciona","Os estudos são heterogêneos e a certeza é menor","Ela é contraindicada em cirurgia eletiva","Só vale para pacientes jovens"], a:1, e:"Evidência baixa é sobre certeza, não sobre ineficácia. Para o TMI isolado, a revisão de 2024 mostra efeito consistente sobre pneumonia."}
  ]
},
{
  id:"preop", n:2, title:"Pré-habilitação", sub:"Medir a reserva e treinar em três semanas",
  blocks:[
    {t:"html", html:`<span class="kicker">O que medimos antes de operar</span>
      <p>A cirurgia vai gastar a reserva do paciente. A fisioterapia mede essa reserva em quatro sistemas:</p>
      <div class="tablewrap"><table>
      <tr><th>Teste</th><th>Seu Raimundo</th><th>Leitura</th></tr>
      <tr><td>PImáx</td><td>62 cmH₂O</td><td>59% do previsto</td></tr>
      <tr><td>TC6</td><td>380 m</td><td>70% do previsto</td></tr>
      <tr><td>Preensão palmar</td><td>26 kgf</td><td>abaixo de 27 kgf (EWGSOP2, homens): sarcopenia provável</td></tr>
      <tr><td>SPPB</td><td>9/12</td><td>limitação moderada</td></tr>
      </table></div>
      <p class="small">Testes sempre monitorizados e interrompidos se houver angina. Angina instável ou lesão crítica de tronco contraindicam teste de esforço.</p>`},
    {t:"calc", id:"sppb"},
    {t:"calc", id:"tmi"},
    {t:"html", html:`<span class="kicker">Treino muscular inspiratório: o essencial</span>
      <ul>
      <li><b>Comece em 30% da PImáx</b>, com resistor de carga linear pressórica, e progrida pelo esforço percebido.</li>
      <li>20 a 30 min por dia, por pelo menos 2 semanas.</li>
      <li><b>Remeça a PImáx toda semana</b> e recalcule a carga: sem isso, o treino vira subcarga.</li>
      <li>Um resistor de orifício (fluxo-dependente) não garante a carga prescrita.</li>
      </ul>
      <p><b>Evidência:</b> revisão sistemática com 8 ECR e 696 pacientes (J Physiother 2024): menos complicações pulmonares (RR 0,51), menos pneumonia (RR 0,44) e 1,7 dia a menos de internação.</p>
      <p><b>Contraponto honesto:</b> no ensaio PREHAB (n = 180), exercício + TMI não melhorou o TC6 no grupo geral; o efeito foi maior nos sarcopênicos. Selecione quem mais precisa.</p>`},
    {t:"calc", id:"tc6"},
    {t:"html", html:`<span class="kicker">Caminhada: metros não bastam</span>
      <p>Distância é <b>volume</b>, não intensidade. O mesmo 1 km pode ser feito em 12 ou em 25 minutos. Prescreva <b>distância + tempo</b> (que é velocidade), e use como checagem:</p>
      <ul>
      <li><b>Teto:</b> abaixo do limiar de angina. Se houve dor no teste, cerca de 10 bpm abaixo da FC em que ela começou.</li>
      <li><b>Borg</b> 11 a 13 e <b>teste da fala</b> (conversa, mas não canta).</li>
      <li>Progrida aumentando distância e tempo juntos, mantendo a velocidade.</li>
      </ul>
      <p class="small">O TC6 é submáximo: não use a FC do TC6 na fórmula de Karvonen.</p>`},
  ],
  quiz:[
    {q:"Qual a carga inicial de TMI usada nos ensaios pré-operatórios em cirurgia cardíaca?", o:["15% da PImáx","30% da PImáx","60% da PImáx","80% da PImáx"], a:1, e:"Os ensaios de referência começaram em 30% da PImáx, com progressão. Em coronariopata com angina, carga alta aumenta o esforço sem benefício adicional demonstrado."},
    {q:"PImáx medida de 62 cmH₂O. Quanto é a carga inicial de 30%?", o:["≈ 12 cmH₂O","≈ 19 cmH₂O","≈ 31 cmH₂O","≈ 43 cmH₂O"], a:1, e:"62 × 0,30 ≈ 18,6, ou cerca de 19 cmH₂O."},
    {q:"Por que não usar a FC atingida no TC6 como FC máxima em Karvonen?", o:["Porque o TC6 é um teste submáximo","Porque o TC6 superestima a FC","Porque Karvonen não vale para cardiopatas","Porque o TC6 não mede FC"], a:0, e:"O TC6 é submáximo. O que ele dá de útil para prescrever é a velocidade de caminhada."},
    {q:"Qual prescrição de caminhada controla intensidade e volume?", o:["Caminhar 1 km por dia","Caminhar 30 minutos","Caminhar 750 m em 15 minutos, Borg 11–13","Caminhar até cansar"], a:2, e:"Distância + tempo define a velocidade (aqui 50 m/min). Borg e limiar de angina são as checagens de segurança."},
    {q:"Preensão palmar de 26 kgf num homem indica, pelo EWGSOP2:", o:["Força normal","Sarcopenia provável","Sarcopenia grave confirmada","Fragilidade pelo fenótipo de Fried"], a:1, e:"Abaixo de 27 kgf em homens é critério de sarcopenia provável. Confirmar exige medir massa muscular."},
    {q:"No ensaio PREHAB (2023), quem mais se beneficiou da pré-habilitação no TC6?", o:["Os pacientes mais jovens","Os sarcopênicos","Os não diabéticos","Todos igualmente"], a:1, e:"Sem diferença no grupo geral; o efeito foi maior nos sarcopênicos. A mensagem é selecionar."}
  ]
},
{
  id:"cbdf", n:3, title:"Diagnóstico pela CBDF", sub:"Da doença (CID) à função (CBDF)",
  blocks:[
    {t:"html", html:`<span class="kicker">O que é</span>
      <p>A <b>Classificação Brasileira de Diagnósticos Fisioterapêuticos</b> foi instituída pelo COFFITO na Resolução 555/2022 e atualizada pela Resolução 610/2025. Segue a lógica da CIF.</p>
      <div class="quote">O CID diz o que o paciente tem. A CBDF diz o que ele não consegue fazer, e é isso que eu trato.</div>
      <div class="tablewrap"><table>
      <tr><th>Categoria</th><th>O que descreve</th></tr>
      <tr><td><b>S</b></td><td>Saúde cinético-funcional, com ou sem risco</td></tr>
      <tr><td><b>D</b></td><td>Deficiências, por sistema (ex.: D04 respiratório, D05 cardiovascular)</td></tr>
      <tr><td><b>M</b></td><td>Atividades de mobilidade (ex.: locomoção, transferências)</td></tr>
      <tr><td><b>P</b></td><td>Participação (ex.: atividades recreacionais)</td></tr>
      </table></div>`},
    {t:"calc", id:"qual"},
    {t:"html", html:`<span class="kicker">Por que ela orienta a decisão</span>
      <ul>
      <li><b>Escolhe o alvo:</b> força inspiratória com alteração moderada põe o TMI como prioridade.</li>
      <li><b>Calibra o cuidado:</b> capacidade aeróbica moderada pede aeróbio leve a moderado, supervisionado.</li>
      <li><b>Mede o resultado:</b> reavaliar e recodificar mostra se a conduta funcionou. A participação “caminhar na orla” vira o critério de alta do programa.</li>
      </ul>
      <p><b>Ela não define a dose.</b> A dose sai dos testes: velocidade do TC6, % da PImáx, teste de esforço. A CBDF norteia; os testes dosam.</p>`},
    {t:"html", html:`<div class="note"><b>Sobre os códigos do caso.</b> Os códigos completos mostrados na aula são exemplos didáticos. Antes de usar qualquer código na prática, confira no sistema oficial da CBDF, que é a referência.</div>`},
    {t:"links", items:[
      {t:"Sistema CBDF (COFFITO)", s:"Consulta oficial dos códigos", u:"https://cbdf.coffito.gov.br/cbdf"},
      {t:"Notícias e resoluções do COFFITO sobre a CBDF", s:"coffito.gov.br", u:"https://www.coffito.gov.br/nsite/?s=cbdf"},
      {t:"Artigo: Brazilian classification of physical therapy diagnosis", s:"PubMed Central", u:"https://pmc.ncbi.nlm.nih.gov/articles/PMC11225182/"},
      {t:"CBDF na Fisioterapia UFBA", s:"fisioterapia.ufba.br", u:"https://fisioterapia.ufba.br/classificacao-brasileira-de-diagnosticos-fisioterapeuticos-cbdf"}
    ]}
  ],
  quiz:[
    {q:"Quais são as quatro categorias da CBDF?", o:["A, B, C e D","S, D, M e P","Estrutura, função, atividade e ambiente","Leve, moderada, grave e completa"], a:1, e:"S (saúde cinético-funcional), D (deficiências), M (mobilidade) e P (participação)."},
    {q:"TC6 a 70% do previsto corresponde a qual qualificador de capacidade aeróbica?", o:["0, sem alteração","1, leve","2, moderada","3, grave"], a:2, e:"Na escala da CIF, 51 a 75% do previsto é alteração moderada, qualificador 2."},
    {q:"Sobre a CBDF e a prescrição de exercício, é correto dizer que:", o:["A CBDF define a dose do exercício","A CBDF norteia o alvo e a prioridade; a dose vem dos testes","A CBDF substitui o teste de esforço","A CBDF só serve para faturamento"], a:1, e:"Ela diz qual função está alterada, quanto e para onde ir. A intensidade sai dos testes."},

      <p><b>“Keep Your Move in the Tube”:</b> para fazer força, braços junto ao tronco, como se estivesse dentro de um tubo. Sem carga, amplitude livre guiada pelo conforto. Tosse sempre com apoio esternal.</p>

    }
  },
  tc6: {
    title:"Calculadora: caminhada a partir do TC6",
    html:`<label for="tDist">Distância no TC6 (metros)</label><input id="tDist" type="number" inputmode="decimal" value="380">
      <label for="tCorr">Comprimento do corredor ou trecho de referência (metros)</label><input id="tCorr" type="number" inputmode="decimal" value="50">
      <div id="tOut"></div>`,
    init(root){
      const run=()=>{
        const d=num($("#tDist",root).value), c=num($("#tCorr",root).value);
        if(!(d>0)){ $("#tOut",root).innerHTML=""; return; }
        const v=d/6, lo=v*0.7, hi=v*0.8, mid=v*0.75;
        const rows=[15,20,30].map(min=>`<tr><td>${min} min</td><td>${fmt(Math.round(lo*min/50)*50)}–${fmt(Math.round(hi*min/50)*50)} m</td></tr>`).join("");
        const laps = c>0 ? `Num trecho de ${fmt(c)} m, cerca de <b style="color:#fff">${fmt(mid/c,1)} volta(s) por minuto</b>.` : "";
        $("#tOut",root).innerHTML=`<div class="out"><div class="outgrid">
          <div><div class="lbl">Velocidade no TC6</div><div class="big">${fmt(v,0)} m/min</div><p>${fmt(v*0.06,1)} km/h</p></div>
          <div><div class="lbl">Faixa de treino 70–80%</div><div class="big">${fmt(lo,0)}–${fmt(hi,0)}</div><p>m/min</p></div></div>
          <p>${laps}</p></div>
          <div class="tablewrap" style="margin-top:10px"><table><tr><th>Tempo</th><th>Distância prescrita</th></tr>${rows}</table></div>
          <p class="small">Ponto de partida, não teto. Quem manda é o limiar de angina, o Borg 11–13 e o teste da fala. A faixa de 70–80% é uma referência prática; confira com o protocolo do seu serviço.</p>`;
      };
      root.querySelectorAll("input").forEach(i=>i.addEventListener("input",run)); run();
    }
  },
  qual: {
    title:"Calculadora: % do previsto → qualificador",
    html:`<label for="qPct">Resultado em % do previsto</label><input id="qPct" type="number" inputmode="decimal" value="70">
      <div id="qOut"></div>
      <div class="tablewrap" style="margin-top:10px"><table>
      <tr><th>Qualificador</th><th>Alteração</th><th>% do previsto</th></tr>
      <tr><td>0</td><td>Sem alteração</td><td>≥ 96%</td></tr>
      <tr><td>1</td><td>Leve</td><td>76–95%</td></tr>
      <tr><td>2</td><td>Moderada</td><td>51–75%</td></tr>
      <tr><td>3</td><td>Grave</td><td>5–50%</td></tr>
      <tr><td>4</td><td>Completa</td><td>&lt; 5%</td></tr></table></div>
      <p class="small">Faixas da CIF. Para regras específicas de cada caracterizador, consulte o sistema oficial da CBDF.</p>`,
    init(root){
      const run=()=>{ const p=num($("#qPct",root).value); if(!isFinite(p)){ $("#qOut",root).innerHTML=""; return; }
        const q=qualifier(p); $("#qOut",root).innerHTML=`<div class="out"><div class="lbl">Qualificador</div><div class="big">${q.n} · ${q.t}</div><p>Exemplos do caso: TC6 a 70% → capacidade aeróbica 2; PImáx a 59% → força inspiratória 2.</p></div>`; };
      $("#qPct",root).addEventListener("input",run); run();
    }
  },
  pbw: {
    title:"Calculadora: volume corrente pelo peso predito",
    html:`<div class="row2"><div><label for="bSex">Sexo</label><select id="bSex"><option value="m">Masculino</option><option value="f">Feminino</option></select></div>
      <div><label for="bH">Altura (cm)</label><input id="bH" type="number" inputmode="decimal" value="170"></div></div>
      <div id="bOut"></div>
      <p class="small" style="margin-top:8px">Peso predito: homens 50 + 0,91 × (altura − 152,4); mulheres 45,5 + 0,91 × (altura − 152,4). O pulmão tem o tamanho da altura, não do peso.</p>`,
    init(root){
      const run=()=>{ const h=num($("#bH",root).value); if(!(h>100)){ $("#bOut",root).innerHTML=""; return; }
        const w=($("#bSex",root).value==="m"?50:45.5)+0.91*(h-152.4);
        $("#bOut",root).innerHTML=`<div class="out"><div class="outgrid"><div><div class="lbl">Peso predito</div><div class="big">${fmt(w,1)} kg</div></div>
        <div><div class="lbl">VC 6–8 mL/kg</div><div class="big">${fmt(w*6,0)}–${fmt(w*8,0)}</div><p>mL</p></div></div></div>`; };
      root.querySelectorAll("input,select").forEach(i=>i.addEventListener("input",run)); run();
    }
  },
  fcr: {
    title:"Calculadora: zona pela FC de reserva",
    html:`<p class="small">Use a FC pico do <b>teste de esforço em uso da medicação</b>, nunca a do TC6.</p>
      <div class="row2"><div><label for="fRep">FC de repouso (bpm)</label><input id="fRep" type="number" inputmode="numeric" value="68"></div>
      <div><label for="fPico">FC pico no teste (bpm)</label><input id="fPico" type="number" inputmode="numeric" value="128"></div></div>
      <label for="fIsq">FC no limiar isquêmico, se houve (bpm, opcional)</label><input id="fIsq" type="number" inputmode="numeric" placeholder="ex.: 118">
      <div id="fOut"></div>`,
    init(root){
      const run=()=>{ const r=num($("#fRep",root).value), p=num($("#fPico",root).value), i=num($("#fIsq",root).value);
        if(!(r>0&&p>r)){ $("#fOut",root).innerHTML=""; return; }
        const z=x=>Math.round(r+(p-r)*x);
        let lo=z(.4), hi=z(.8), cap="";
        if(i>0){ const c=i-10; if(hi>c){ hi=c; cap=`Teto ajustado para 10 bpm abaixo do limiar isquêmico (${c} bpm).`; } else cap=`O teto do limiar isquêmico (${c} bpm) está acima da faixa.`; }
        $("#fOut",root).innerHTML=`<div class="out"><div class="lbl">Faixa de treino aeróbio</div><div class="big">${lo}–${Math.max(lo,hi)} bpm</div>
        <p>40% = ${z(.4)} · 60% = ${z(.6)} · 80% = ${z(.8)} bpm. ${cap} Combine com Borg 11–14.</p></div>`; };
      root.querySelectorAll("input").forEach(i=>i.addEventListener("input",run)); run();
    }
  }
};
function qualifier(p){
  if(p>=96) return {n:0,t:"sem alteração"};
  if(p>=76) return {n:1,t:"leve"};
  if(p>=51) return {n:2,t:"moderada"};
  if(p>=5)  return {n:3,t:"grave"};
  return {n:4,t:"completa"};
}

/* ====================== Jogo de classificação ====================== */
const SORTS = {
  alertas: {
    title:"Desafio: adiar, parar ou seguir?",
    intro:"Para cada situação na mobilização, escolha o que você faz. Depois toque em Conferir.",
    cats:["Adiar","Parar","Pode seguir"],
    items:[
      ["PAM abaixo de 65 mmHg ou vasoativo em ascensão",0],
      ["Dor torácica, palidez ou sudorese durante a marcha",1],
      ["Dreno torácico sem sangramento ativo",2],
      ["Sangramento ativo pelos drenos",0],
      ["FC que ficou irregular durante a caminhada",1],
      ["Dose baixa e estável de vasoativo",2],
      ["SpO₂ abaixo de 90% apesar do oxigênio",0],

      ["Dor mal controlada (barreira modificável: tratar e seguir)",2]
    ],
    foot:"Referência conceitual: consenso de Hodgson 2014 (semáforo). Os valores de corte devem seguir o protocolo do seu serviço."
  }
};

/* ====================== Cenário ramificado ====================== */
const SCENARIOS = {
  fa: {
    title:"Cenário: 3º PO, o pulso mudou no corredor",
    lead:"Aos 80 m de caminhada, Seu Raimundo relata palpitação e tontura leve. FC 142 bpm, pulso irregular, PA 104 × 62 mmHg, SpO₂ 94% em ar ambiente. O que você faz?",
    opts:[
      ["Reduz o ritmo e termina a volta para não perder o treino", false, "Não. Sintomático, com FC alta e ritmo irregular, o exercício para agora."],
      ["Para, senta o paciente, fica com ele, monitoriza ritmo, PA e SpO₂ e aciona a equipe", true, "Isso. Parar, sentar, monitorizar, comunicar. O exercício fica suspenso até o controle de frequência e ritmo."],
      ["Leva de volta ao leito caminhando e registra no fim do turno", false, "Não. Caminhar mais é esforço extra, e a comunicação precisa ser imediata."],
      ["Suspende a reabilitação até a alta hospitalar", false, "Exagero. Após controle e estabilidade, a mobilização volta monitorizada e mais lenta. No caso, ele voltou a caminhar no 4º PO."]
    ]
  }
};

/* ====================== Telas ====================== */
const app = $("#app");
function header(title, back){
  const pct = Math.round(doneCount()/MODULES.length*100);
  return `<header class="top"><div class="wrap">${back?`<button class="back" aria-label="Voltar" onclick="location.hash='#/'">‹</button>`:""}<div class="title">${esc(title)}</div><div class="prog">${doneCount()}/${MODULES.length} estações</div></div></header>`;
}

function renderHome(){
  const d=doneCount(), pct=Math.round(d/MODULES.length*100);
  const stations = MODULES.map(m=>{
    const p=progress[m.id]||{}; const cls = p.quiz?"done":(p.visited?"started":"");
    const chip = p.quiz ? `<span class="chip ok">Quiz: ${p.quiz.score}/${p.quiz.total}</span>` : `<span class="chip q">${m.quiz.length} perguntas</span>`;
    const n = (m.blocks.filter(b=>b.t==="calc"||b.t==="sort"||b.t==="scenario").length);
    return `<li><a class="station ${cls}" href="#/m/${m.id}"><div class="dot">${p.quiz?"✓":m.n}</div><div class="card"><h3>${esc(m.title)}</h3><p>${esc(m.sub)}</p><div class="chips">${n?`<span class="chip">${n} demonstraç${n>1?"ões":"ão"}</span>`:""}${chip}</div></div></a></li>`;
  }).join("");
  app.innerHTML = `
  <section class="hero"><div class="wrap" style="padding-top:calc(18px + env(safe-area-inset-top))">
    <span class="eyebrow">Trilha de aprendizagem</span>
    <h1>Da admissão à alta, e além</h1>
    <p>Fisioterapia no paciente cardíaco cirúrgico: tudo o que não coube em 30 minutos.</p>
    <svg class="ecg" viewBox="0 0 600 46" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30 H120 l10 -8 l10 8 h20 l6 6 l10 -30 l12 40 l8 -16 h30 q18 -14 36 0 h40 H330 l10 -8 l10 8 h20 l6 6 l10 -30 l12 40 l8 -16 h30 q18 -14 36 0 h40 H600"/></svg>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div class="barlabel">${d===MODULES.length?"Trilha concluída!":`${d} de ${MODULES.length} estações concluídas`}</div>
    <div class="actions">
      <a class="btn" href="aula.pdf" target="_blank" rel="noopener">⬇ PDF da aula</a>
      <a class="btn ghost" href="#/sobre">Como usar offline</a>
    </div>
  </div></section>
  <main><div class="wrap">
    <h2>As seis estações</h2>
    <ul class="trail">${stations}</ul>
    ${d===MODULES.length?`<div class="block badge"><div class="medal" aria-hidden="true">🫀</div><h3>Trilha completa</h3><p>Você passou pelas seis estações do Seu Raimundo. Agora ele voltou a caminhar na orla com os netos.</p></div>`:""}
    <div class="block links"><span class="kicker blue">Acesso rápido</span>
      <a href="#/refs"><b>Referências da aula</b><span class="s">${REFS.length} fontes ›</span></a>
      <a href="https://cbdf.coffito.gov.br/cbdf" target="_blank" rel="noopener"><b>Sistema oficial da CBDF</b><span class="net">internet</span></a>
    </div>
    <p class="small">Conteúdo educativo para profissionais de saúde. O caso é fictício e os números são ilustrativos. Siga sempre o protocolo da sua instituição.</p>
  </div></main>
  <footer>Prof.ª Dr.ª Séres Costa de Souza Nascimento · 4º Congresso Internacional de Fisioterapia Cardiorrespiratória e Metabólica · 2026</footer>`;
  window.scrollTo(0,0);
}

function renderModule(id){
  const m = MODULES.find(x=>x.id===id); if(!m) return renderHome();
  progress[m.id] = Object.assign({}, progress[m.id], {visited:true}); saveProgress();
  const idx = MODULES.indexOf(m);
  let html = header(`${m.n}. ${m.title}`, true) + `<main><div class="wrap"><h2 style="margin-top:6px">${esc(m.title)}</h2><p class="small" style="margin-top:-4px">${esc(m.sub)}</p>`;
  m.blocks.forEach((b,i)=>{
    if(b.t==="html") html += `<div class="block">${b.html}</div>`;
    if(b.t==="calc") html += `<div class="block" data-calc="${b.id}"><span class="kicker blue">Demonstração</span><h3>${CALCS[b.id].title}</h3>${CALCS[b.id].html}</div>`;
    if(b.t==="links") html += `<div class="block links"><span class="kicker blue">Links diretos</span>${b.items.map(l=>`<a href="${l.u}" target="_blank" rel="noopener"><span><b>${esc(l.t)}</b><br><span class="s">${esc(l.s)}</span></span><span class="net">internet</span></a>`).join("")}</div>`;
    if(b.t==="sort") html += `<div class="block" data-sort="${b.id}"></div>`;
    if(b.t==="scenario") html += `<div class="block" data-scen="${b.id}"></div>`;
  });
  html += `<div class="block" id="quiz"></div>`;
  html += `<div class="navbtns">${idx>0?`<a class="btn light small" href="#/m/${MODULES[idx-1].id}">‹ ${esc(MODULES[idx-1].title)}</a>`:`<a class="btn light small" href="#/">‹ Início</a>`}${idx<MODULES.length-1?`<a class="btn small" href="#/m/${MODULES[idx+1].id}">${esc(MODULES[idx+1].title)} ›</a>`:`<a class="btn small" href="#/">Concluir ›</a>`}</div>`;
  html += `</div></main>`;
  app.innerHTML = html;
  app.querySelectorAll("[data-calc]").forEach(el=>CALCS[el.dataset.calc].init(el));
  app.querySelectorAll("[data-sort]").forEach(el=>mountSort(el, SORTS[el.dataset.sort]));
  app.querySelectorAll("[data-scen]").forEach(el=>mountScenario(el, SCENARIOS[el.dataset.scen]));
  mountQuiz($("#quiz"), m);
  window.scrollTo(0,0);
}

function mountSort(el, s){
  const choice = s.items.map(()=>null);
  el.innerHTML = `<span class="kicker blue">Demonstração</span><h3>${s.title}</h3><p>${s.intro}</p>` +
    s.items.map((it,i)=>`<div class="sortitem" data-i="${i}"><div>${esc(it[0])}</div><div class="seg">${s.cats.map((c,j)=>`<button data-j="${j}" aria-pressed="false">${c}</button>`).join("")}</div></div>`).join("") +
    `<button class="btn" style="width:100%;margin-top:6px" id="sortCheck">Conferir</button><div id="sortRes" style="margin-top:10px"></div><p class="small" style="margin-top:8px">${s.foot}</p>`;
  el.querySelectorAll(".sortitem").forEach(row=>{
    const i=+row.dataset.i;
    row.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
      row.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true"); choice[i]=+b.dataset.j; row.classList.remove("right","wrong");
    }));
  });
  $("#sortCheck",el).addEventListener("click",()=>{
    if(choice.some(c=>c===null)){ toast("Classifique todas as situações"); return; }
    let ok=0;
    el.querySelectorAll(".sortitem").forEach(row=>{ const i=+row.dataset.i; const r=choice[i]===s.items[i][1]; if(r) ok++; row.classList.toggle("right",r); row.classList.toggle("wrong",!r);
      if(!r && !row.querySelector(".fix")){ const f=document.createElement("div"); f.className="small fix"; f.textContent="Resposta: "+s.cats[s.items[i][1]]; row.appendChild(f);} });
    $("#sortRes",el).innerHTML=`<div class="fb ${ok===s.items.length?"ok":"bad"}"><b>${ok} de ${s.items.length} certas.</b> ${ok===s.items.length?"Vigiar é intervir.":"Revise as marcadas em vermelho."}</div>`;
  });
}

function mountScenario(el, s){
  el.innerHTML = `<span class="kicker blue">Demonstração · decisão clínica</span><h3>${s.title}</h3><p>${s.lead}</p><div class="opts">${s.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o[0])}</button>`).join("")}</div><div class="scfb"></div>`;
  el.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    const o=s.opts[+b.dataset.i];
    el.querySelectorAll(".opt").forEach(x=>x.classList.remove("right","wrong"));
    b.classList.add(o[1]?"right":"wrong");
    $(".scfb",el).innerHTML=`<div class="fb ${o[1]?"ok":"bad"}">${o[2]}</div>`;
  }));
}

function mountQuiz(el, m){
  let i=0, score=0;
  const prev = progress[m.id] && progress[m.id].quiz;
  function intro(){
    el.innerHTML = `<span class="kicker">Quiz da estação</span><h3>${m.quiz.length} perguntas</h3>${prev?`<p>Seu último resultado: <b>${prev.score}/${prev.total}</b>.</p>`:"<p>Teste o que ficou desta estação.</p>"}<button class="btn" style="width:100%" id="qStart">${prev?"Refazer o quiz":"Começar o quiz"}</button>`;
    $("#qStart",el).addEventListener("click",()=>{ i=0; score=0; show(); });
  }
  function show(){
    const q=m.quiz[i];
    el.innerHTML = `<div class="qhead"><span>Pergunta ${i+1} de ${m.quiz.length}</span><span>${score} acerto${score===1?"":"s"}</span></div>
      <div class="qtext">${esc(q.q)}</div><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}</div><div class="qfb"></div>`;
    el.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      const j=+b.dataset.j, r=j===q.a; if(r) score++;
      el.querySelectorAll(".opt").forEach((x,k)=>{ x.disabled=true; if(k===q.a) x.classList.add("right"); });
      if(!r) b.classList.add("wrong");
      $(".qfb",el).innerHTML=`<div class="fb ${r?"ok":"bad"}"><b>${r?"Isso.":"Não exatamente."}</b> ${esc(q.e)}</div>
        <button class="btn" style="width:100%;margin-top:10px" id="qNext">${i<m.quiz.length-1?"Próxima":"Ver resultado"}</button>`;
      $("#qNext",el).addEventListener("click",()=>{ i++; if(i<m.quiz.length) show(); else finish(); });
      $("#qNext",el).focus({preventScroll:true});
    }));
  }
  function finish(){
    progress[m.id] = Object.assign({}, progress[m.id], {quiz:{score, total:m.quiz.length}}); saveProgress();
    const all = doneCount()===MODULES.length;
    el.innerHTML = `<div class="badge"><div class="medal" aria-hidden="true">${score===m.quiz.length?"🏅":"✓"}</div><h3>${score} de ${m.quiz.length}</h3><p>${score===m.quiz.length?"Estação dominada.":"Estação concluída. Releia os pontos que errou e refaça quando quiser."}</p>${all?"<p><b>Você completou a trilha inteira!</b></p>":""}<button class="btn light" style="width:100%" id="qAgain">Refazer</button></div>`;
    $("#qAgain",el).addEventListener("click",()=>{ i=0; score=0; show(); });
    const t=$(".top .prog"); if(t) t.textContent=`${doneCount()}/${MODULES.length} estações`;
  }
  intro();
}

function renderRefs(){
  app.innerHTML = header("Referências", true) + `<main><div class="wrap"><h2 style="margin-top:6px">Referências da aula</h2>
  <p class="small">Os links abrem a fonte ou uma busca no PubMed e precisam de internet.</p>
  <div class="block links">${REFS.map(r=>`<a href="${r.u}" target="_blank" rel="noopener"><span>${esc(r.t)}</span><span class="net">internet</span></a>`).join("")}</div>
  <a class="btn light" href="#/">‹ Voltar à trilha</a></div></main>`;
  window.scrollTo(0,0);
}

function renderAbout(){
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  app.innerHTML = header("Como usar offline", true) + `<main><div class="wrap"><h2 style="margin-top:6px">Leve a trilha no bolso</h2>
  <div class="block"><span class="kicker">Funciona sem internet</span>
    <p>Depois que você abre esta página uma vez com internet, a trilha, as demonstrações, os quizzes e o PDF da aula ficam guardados no seu celular e funcionam offline.</p>
    <p class="small">Só os links externos (CBDF, PubMed) precisam de conexão.</p></div>
  <div class="block"><span class="kicker">Instale na tela inicial</span>
    ${ios?`<ol class="steps"><li>No Safari, toque em <b>Compartilhar</b> (quadrado com seta).</li><li>Escolha <b>Adicionar à Tela de Início</b>.</li><li>Toque em <b>Adicionar</b>.</li></ol>`:
    `<ol class="steps"><li>No Chrome, toque nos <b>três pontinhos</b>.</li><li>Escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</li><li>Confirme.</li></ol>`}
    <button class="btn" style="width:100%;display:none" id="installBtn">Instalar agora</button></div>
  <div class="block"><span class="kicker">Seu progresso</span><p>Fica salvo só neste aparelho.</p><button class="btn light" style="width:100%" id="resetBtn">Recomeçar a trilha</button></div>
  <a class="btn light" href="#/">‹ Voltar à trilha</a></div></main>`;
  if(deferredPrompt){ const b=$("#installBtn"); b.style.display="flex"; b.addEventListener("click", async()=>{ deferredPrompt.prompt(); deferredPrompt=null; b.style.display="none"; }); }
  $("#resetBtn").addEventListener("click",()=>{ progress={}; saveProgress(); toast("Progresso apagado"); });
  window.scrollTo(0,0);
}

let deferredPrompt=null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredPrompt=e; });

function route(){
  const h = location.hash || "#/";
  if(h.startsWith("#/m/")) return renderModule(h.slice(4));
  if(h==="#/refs") return renderRefs();
  if(h==="#/sobre") return renderAbout();
  renderHome();
}
window.addEventListener("hashchange", route);
route();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
